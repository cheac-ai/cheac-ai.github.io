project:
  type: website
  output-dir: _site
  pre-render: scripts/fetch_suggestions.py
  render:
    - "*.qmd"
    - "*.md"
    - "!README.md"
    - "!AGENTS.md"
  resources:
    - documents/*.pdf
    - assets/logos/*
    - assets/figures/*
    - favicon.ico

website:
  title: "&#92;btw"
  favicon: assets/logos/cheac-logo-square-transparent.svg
  navbar:
    logo: assets/logos/cheac-logo-long-transparent.svg
    logo-alt: "CHEAC logo"
    background: light
    search: true
    left:
      - href: index.qmd
        text: Home
      - href: practices/index.qmd
        text: "Best Practices"
      - href: guidelines/index.qmd
        text: "Guidelines"
      - href: ai-in-research/index.qmd
        text: "AI in research"
      - href: transparency/index.qmd
        text: "Transparency"
      - href: news/index.qmd
        text: "AI News"
    right:
      - href: suggestions/index.qmd
        text: "Suggestion box"
      - href: contributing/contributing.qmd
        text: "Contributing"

bibliography: references.bib

format:
  html:
    theme: 
      - cosmo
      - custom.scss
    toc: true
    code-copy: true