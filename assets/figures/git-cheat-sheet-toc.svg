<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="453.543" height="255.118" viewBox="0 0 453.543 255.118">
<title>Three copies of one repository: upstream, origin, and local</title>
<defs>
  <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
    <path d="M 0 1 L 10 5 L 0 9 z" fill="#000" stroke="none"/>
  </marker>
</defs>
<g fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">
  <!-- upstream: the group repository on GitHub -->
  <rect x="14" y="14" width="178" height="88" rx="8" fill="#fff"/>
  <line x1="84" y1="66" x2="162" y2="66"/>
  <!-- origin: your fork on GitHub -->
  <rect x="261.5" y="14" width="178" height="88" rx="8" fill="#fff"/>
  <line x1="331.5" y1="58" x2="383.5" y2="58"/>
  <path d="M 357.5 58 C 370 58 371 82 383.5 82 L 409.5 82"/>
  <!-- local: your computer -->
  <rect x="138" y="128" width="177" height="94" rx="5" fill="#fff"/>
  <path d="M 130 222 L 323 222 L 333 233 L 120 233 Z" fill="#fff"/>
  <line x1="211" y1="227.5" x2="242" y2="227.5" stroke-width="0.6"/>
  <line x1="208" y1="174" x2="260" y2="174"/>
  <path d="M 234 174 C 246.5 174 247.5 198 260 198 L 286 198"/>
  <!-- fork (once): upstream to origin -->
  <line x1="197" y1="40" x2="256" y2="40" stroke-dasharray="3 2.5" marker-end="url(#head)"/>
  <!-- pull request: origin to upstream -->
  <line x1="256" y1="74" x2="197" y2="74" marker-end="url(#head)"/>
  <!-- git pull upstream main: upstream to local -->
  <path d="M 118 104 C 118 150 120 168 134 168" marker-end="url(#head)"/>
  <!-- git push origin fix-qrange: local to origin -->
  <path d="M 319 168 C 333 168 335 150 335 106" marker-end="url(#head)"/>
</g>
<!-- commits -->
<g fill="#fff" stroke="#000" stroke-width="0.9">
  <circle cx="84" cy="66" r="4.5"/>
  <circle cx="110" cy="66" r="4.5"/>
  <circle cx="136" cy="66" r="4.5"/>
  <circle cx="162" cy="66" r="4.5"/>
  <circle cx="331.5" cy="58" r="4.5"/>
  <circle cx="357.5" cy="58" r="4.5"/>
  <circle cx="383.5" cy="58" r="4.5"/>
  <circle cx="383.5" cy="82" r="4.5"/>
  <circle cx="409.5" cy="82" r="4.5"/>
  <circle cx="208" cy="174" r="4.5"/>
  <circle cx="234" cy="174" r="4.5"/>
  <circle cx="260" cy="174" r="4.5"/>
  <circle cx="260" cy="198" r="4.5"/>
  <circle cx="286" cy="198" r="4.5"/>
</g>
<g font-family="Helvetica, Arial, sans-serif" fill="#000">
  <!-- box titles -->
  <text x="26" y="31" font-size="10" font-weight="bold">upstream</text>
  <text x="26" y="43" font-size="7.5" font-style="italic">the group's repository on GitHub</text>
  <text x="273.5" y="31" font-size="10" font-weight="bold">origin</text>
  <text x="273.5" y="43" font-size="7.5" font-style="italic">your fork on GitHub</text>
  <text x="150" y="145" font-size="10" font-weight="bold">local</text>
  <text x="150" y="157" font-size="7.5" font-style="italic">your computer</text>
  <!-- branch lanes -->
  <text x="26" y="68.5" font-size="8">main</text>
  <text x="273.5" y="60.5" font-size="8">main</text>
  <text x="273.5" y="84.5" font-size="8">fix-qrange</text>
  <text x="150" y="176.5" font-size="8">main</text>
  <text x="150" y="200.5" font-size="8">fix-qrange</text>
  <!-- arrow labels -->
  <text x="226.75" y="33" font-size="7.5" font-style="italic" text-anchor="middle">fork (once)</text>
  <text x="226.75" y="87" font-size="7.5" font-style="italic" text-anchor="middle">pull request</text>
</g>
<g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="7.5" fill="#000">
  <text x="110" y="134" text-anchor="end">git pull</text>
  <text x="110" y="144" text-anchor="end">upstream main</text>
  <text x="343" y="134">git push</text>
  <text x="343" y="144">origin fix-qrange</text>
</g>
</svg>
