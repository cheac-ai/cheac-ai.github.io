<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="453.543" height="255.118" viewBox="0 0 453.543 255.118">
<title>The onboarding stack: a VS Code window on a Miniconda base, with a Git Bash terminal and a Claude Code session kept inside one dashed project folder</title>
<rect width="453.543" height="255.118" fill="#fff"/>
<g fill="none" stroke="#000" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round">

  <!-- base: Miniconda with conda-forge -->
  <path d="M 36 214 L 418 214 L 426 236 L 28 236 Z" fill="#fff"/>
  <!-- small conda "snake" on the base -->
  <path d="M 52 228 C 58 220, 64 230, 70 222 C 76 214, 82 226, 88 220" stroke-width="1.2"/>
  <circle cx="89.5" cy="219.2" r="1.6" fill="#fff"/>

  <!-- VS Code window -->
  <rect x="62" y="20" width="330" height="188" rx="6" fill="#fff"/>
  <line x1="62" y1="38" x2="392" y2="38"/>
  <circle cx="74" cy="29" r="3" fill="#fff"/>
  <circle cx="84" cy="29" r="3" fill="#fff"/>
  <circle cx="94" cy="29" r="3" fill="#fff"/>
  <!-- activity bar -->
  <line x1="80" y1="38" x2="80" y2="208" stroke-width="0.6"/>
  <rect x="66" y="48" width="10" height="10" rx="1.5" stroke-width="0.6"/>
  <rect x="66" y="64" width="10" height="10" rx="1.5" stroke-width="0.6"/>
  <!-- Claude spark in the activity bar -->
  <g stroke-width="0.8">
    <line x1="71" y1="81" x2="71" y2="91"/>
    <line x1="66" y1="86" x2="76" y2="86"/>
    <line x1="67.5" y1="82.5" x2="74.5" y2="89.5"/>
    <line x1="74.5" y1="82.5" x2="67.5" y2="89.5"/>
  </g>

  <!-- the project folder: the boundary the session works inside -->
  <path d="M 92 58 L 92 50 L 150 50 L 156 58 L 380 58 L 380 140 L 92 140 Z" stroke-dasharray="4 3" fill="#fff"/>

  <!-- file list -->
  <g stroke-width="0.6">
    <path d="M 100 70 L 100 80 L 108 80 L 108 72 L 106 70 Z"/>
    <path d="M 100 86 L 100 96 L 108 96 L 108 88 L 106 86 Z"/>
    <path d="M 100 104 L 100 112 L 110 112 L 110 105 L 105 105 L 104 104 Z"/>
    <path d="M 100 120 L 100 128 L 110 128 L 110 121 L 105 121 L 104 120 Z"/>
  </g>

  <!-- Claude Code session panel -->
  <rect x="228" y="66" width="142" height="66" rx="4" fill="#fff"/>
  <line x1="228" y1="80" x2="370" y2="80" stroke-width="0.6"/>
  <!-- chat bubbles -->
  <path d="M 300 86 L 362 86 Q 364 86 364 88 L 364 96 Q 364 98 362 98 L 304 98 L 298 102 L 300 97 Z" stroke-width="0.7" fill="#fff"/>
  <path d="M 236 104 L 330 104 Q 332 104 332 106 L 332 122 Q 332 124 330 124 L 238 124 Q 236 124 236 122 Z" stroke-width="0.7" fill="#fff"/>
  <g stroke-width="0.6">
    <line x1="242" y1="110" x2="320" y2="110"/>
    <line x1="242" y1="115" x2="326" y2="115"/>
    <line x1="242" y1="120" x2="296" y2="120"/>
  </g>

  <!-- terminal panel -->
  <line x1="80" y1="150" x2="392" y2="150" stroke-width="0.6"/>
</g>

<g font-family="Source Sans Pro, Helvetica, Arial, sans-serif" fill="#000">
  <text x="227" y="31" font-size="9" text-anchor="middle">VS Code</text>
  <text x="227" y="229" font-size="10" text-anchor="middle">Miniconda · conda-forge</text>
  <text x="160" y="55" font-size="8" font-style="italic">project folder</text>

  <g font-size="7.5">
    <text x="114" y="78">README.md</text>
    <text x="114" y="94">environment.yml</text>
    <text x="114" y="111">data/</text>
    <text x="114" y="127">scripts/</text>
  </g>

  <text x="234" y="76" font-size="8">Claude Code session</text>
  <text x="304" y="94.5" font-size="6.5">plot the CVs</text>

  <text x="88" y="161" font-size="7.5">Git Bash</text>
  <g font-family="Source Code Pro, Consolas, Menlo, monospace" font-size="7.5">
    <text x="88" y="176">(base) $ conda activate hea17</text>
    <text x="88" y="189">(hea17) $ git status</text>
    <text x="88" y="202">(hea17) $ <tspan>▏</tspan></text>
  </g>
</g>
</svg>
