name: Render and Publish Quarto Book

on:
  push:
    branches: main
  workflow_dispatch:
  # Rebuild the Suggestion box when suggestion issues change
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history, so each page can show its last-modified date
          fetch-depth: 0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}